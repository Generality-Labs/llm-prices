# Top-level configuration is LOCAL DEVELOPMENT AND TESTS ONLY: it is what
# `wrangler dev` and the vitest workers pool read. The deployed Worker is
# [env.production] below, so a bare `wrangler deploy` (no --env) can never
# overwrite production — it would create a separate llm-prices-dev Worker.
#
# Bindings ([[kv_namespaces]], [triggers], [[routes]]) are NOT inherited by
# named environments, so production repeats them with the real ids.
name = "llm-prices-dev"
account_id = "4dd4a6b03a79f452ebc112658643f02a"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Inherited by all environments.
[observability.logs]
enabled = true
invocation_logs = true

# Static UI in public/ is served for matching paths; everything else reaches
# fetch(). Inherited by all environments.
[assets]
directory = "./public"
binding = "ASSETS"

# src/llms.md is imported as text. Inherited by all environments.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = false

# Local development/test namespace — simulated locally, so the id is a
# placeholder that never has to exist.
[[kv_namespaces]]
binding = "MODEL_PRICES"
id = "00000000000000000000000000000000"

# Local only. Exercise the scheduled handler with
# `npx wrangler dev --test-scheduled`, then:
#   curl "http://localhost:8787/__scheduled?cron=0+*/6+*+*+*"
[triggers]
crons = ["0 */6 * * *"]

[env.production]
name = "llm-prices"

[[env.production.routes]]
pattern = "llm-prices.generality.org"
custom_domain = true

[env.production.triggers]
crons = ["0 */6 * * *"]

[[env.production.kv_namespaces]]
binding = "MODEL_PRICES"
id = "a11d123eae0c4e95a67af8d8566487ae"
